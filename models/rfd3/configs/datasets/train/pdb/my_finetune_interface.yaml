# Minimal local training dataset config for rfd3, modeled after the native
# PDB interface training config.

defaults:
  - af3_train_interface
  - pdb_base
  - _self_

# Override the native parquet/path locations with local mirrors.
dataset:
  dataset_parser:
    base_dir: ${paths.data.pdb_data_dir}
  dataset:
    name: my_finetune_interface
    data: ${paths.data.pdb_parquet_dir}/interfaces_df.parquet
    filters:
      # Keep only a very small, reasonably clean subset for quick experiments.
      - "deposition_date < '2026-12-31'"
      - "resolution < 9.0"
      - "num_polymer_pn_units <= 300"
      - "cluster.notnull()"
      - "is_inter_molecule"
    columns_to_load:
      - example_id
      - pdb_id
      - assembly_id
      - deposition_date
      - resolution
      - num_polymer_pn_units
      - method
      - cluster
      - n_prot
      - n_nuc
      - n_ligand
      - n_peptide
      - pn_unit_1_iid
      - pn_unit_2_iid
      - pn_unit_1_non_polymer_res_names
      - pn_unit_2_non_polymer_res_names
      - is_inter_molecule
      - all_pn_unit_iids_after_processing
      - involves_loi
  transform:
    crop_contiguous_probability: 0.0
    crop_spatial_probability: 1.0
