# @package _global_
# Head-plus-projection NMF sweep target.
# Use this after ffn_core if you want to test whether the output head and projection mixers
# can still be stably replaced once the main feed-forward blocks are already verified.

defaults:
  - single_structure
  - _self_

name: nmf-head-plus-proj-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  target_keywords:
    - process_pll
    - project_pll
    - to_r_update
    - sequence_head

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
