# @package _global_
# Shared PDB training setup for ZKP-oriented replacement NMF.
#
# Launch example:
#   python models/rfd3/src/rfd3/train_lora.py experiment=nmf_zkp_encoder_pdb \
#     paths.data.pdb_data_dir=/media/zzj/Data/pdb_mirror \
#     paths.data.pdb_parquet_dir=/media/zzj/Data/pdb_metadata_latest \
#     paths.log_dir=$PWD/logs/train_nmf_zkp_pdb
#
# Verify the resolved config before a long run:
#   python models/rfd3/src/rfd3/train_lora.py experiment=nmf_zkp_encoder_pdb --cfg job | less

defaults:
  - _self_
  - /datasets/val/pdb_holdout@datasets.val.pdb_holdout

name: nmf-zkp-pdb

ckpt_config:
  path: /media/zzj/Data/pdb_metadata_latest/rfd3_latest.ckpt
  reset_optimizer: true

datasets:
  # RFD3 keeps DataLoader batch_size=1. GPU occupancy comes from the diffusion
  # microbatch and crop atom count. 80GB can hold roughly pretrain-scale crops.
  diffusion_batch_size_train: 8
  crop_size: 256
  max_atoms_in_crop: 2560
  train:
    # Keep the MixedSampler tree from design_base (pdb.sub_datasets.interface + pn_unit).
    # Do not attach a leaf `dataset` here: that would collapse sampling to
    # WeightedRandomSampler and crash assemble_distributed_loader.
    pdb:
      probability: 1.0
      sub_datasets:
        interface:
          dataset:
            cif_parser_args:
              cache_dir: null
              load_from_cache: false
              save_to_cache: false
        pn_unit:
          dataset:
            cif_parser_args:
              cache_dir: null
              load_from_cache: false
              save_to_cache: false
    monomer_distillation: null
  # Disable design-benchmark validation datasets inherited from design_base;
  # this sweep evaluates only the fixed PDB temporal holdout declared in defaults.
  val:
    unconditional: null
    unconditional_deep: null
    indexed: null
  # Validation uses a fixed temporal holdout. It must remain enabled for the
  # training run so every variant writes identical per-example metrics.
  global_transform_args:
    meta_conditioning_probabilities:
      calculate_hbonds: 0.0

callbacks:
  dump_validation_structures_callback:
    _target_: rfd3.trainer.dump_validation_structures.DumpValidationStructuresCallback
    save_dir: ${paths.output_dir}/val_structures
    dump_predictions: true
    dump_prediction_metadata_json: true
    dump_trajectories: true
    dump_denoised_trajectories_only: false
    one_model_per_file: true
    dump_every_n: 5
    align_trajectories: true
    verbose: true
  store_validation_metrics_in_df_callback:
    _target_: foundry.callbacks.metrics_logging.StoreValidationMetricsInDFCallback
    save_dir: ${paths.output_dir}/val_metrics
    metrics_to_save: all
  log_design_validation_metrics_callback:
    _target_: rfd3.callbacks.LogDesignValidationMetricsCallback

model:
  # Replacement NMF has far fewer trainable parameters than pretraining.
  # Use a short, conservative schedule instead of the base 1.8e-3 schedule.
  lr_scheduler:
    base_lr: 1.0e-4
    warmup_steps: 200

trainer:
  # Validation runs once on the fixed temporal holdout after fit completes.
  prevalidate: false
  n_examples_per_epoch: 64
  # Validation is produced explicitly after fit by train_lora.py. Periodic
  # validation remains disabled here to avoid duplicate expensive holdout runs.
  validate_every_n_epochs: 1000000
  checkpoint_every_n_epochs: 10
  grad_accum_steps: 1
  max_epochs: 5
