# @package _global_
# ZKP head family, one linear at a time.
# Default target is the unique Linear inside to_r_update.

defaults:
  - nmf_zkp_pdb
  - _self_

name: nmf-zkp-head-pdb

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  apply_to_token_initializer: true
  match_mode: exact
  max_replacements: 1
  target_keywords:
    - diffusion_module.to_r_update.1
