# @package _global_
# Conservative NMF sweep target: core feed-forward / transition layers only.
# This is the safest replacement-NMF setting and should be run first.

defaults:
  - single_structure
  - _self_

name: nmf-ffn-core-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  target_keywords:
    - transition_post_token
    - transition_post_atom
    - transition_1
    - process_s_init
    - process_z_init
    - transition_2
    - process_c
    - process_s_trunk
    - process_single_l
    - process_single_m
    - process_z
    - pair_mlp

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
