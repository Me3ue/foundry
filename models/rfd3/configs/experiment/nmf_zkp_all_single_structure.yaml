# @package _global_
# ZKP-oriented NMF: union of layers that are suitable as three-factor NMF
# replacements whose middle square M can serve as a proof target.
#
# This is the documentation hub for the ZKP sweep. It is organized by proof
# priority rather than by legacy LoRA keywords.
#
# 1) Encoder / input-shaping family  (best input-integrity proof targets)
#    - transition_post_token
#    - transition_post_atom
#    - process_s_init
#    - process_z_init
#    - process_c
#    - process_s_trunk
#
# 2) Token/atom projection family  (intermediate-state proof targets)
#    - process_pll
#    - project_pll
#    - upcast.project
#    - downcast.project
#    - process_n
#    - process_single_l
#    - process_single_m
#    - process_z
#    - pair_mlp
#    - transition_1
#    - transition_2
#
# 3) Output-head family  (output-consistency proof targets)
#    - to_r_update
#    - sequence_head
#
# Explicitly excluded:
#    - to_q, to_k, to_v, to_b, to_g
#    - attention pair-bias internals
#    - process_r, process_a

defaults:
  - single_structure
  - _self_

name: nmf-zkp-all-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  apply_to_token_initializer: true
  target_keywords:
    - transition_post_token
    - transition_post_atom
    - process_s_init
    - process_z_init
    - process_c
    - process_s_trunk
    - process_pll
    - project_pll
    - upcast.project
    - downcast.project
    - process_n
    - process_single_l
    - process_single_m
    - process_z
    - pair_mlp
    - transition_1
    - transition_2
    - to_r_update
    - sequence_head

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
