# @package _global_
# LoRA fine-tuning on PDB data.
#
# Launch example:
#   python models/rfd3/src/rfd3/train.py experiment=lora_finetune_pdb \
#     paths.data.pdb_data_dir=/backup01/zzj/pdb_mirror \
#     paths.data.pdb_parquet_dir=/dev/shm/pdb_metadata_latest \
#     paths.log_dir=$PWD/logs
#
# Verify the resolved config before a long run:
#   python models/rfd3/src/rfd3/train.py experiment=lora_finetune_pdb --cfg job | less

defaults:
  - _self_

name: lora


lora:
  enabled: true
  rank: 8
  alpha: 16
  dropout: 0.05
  apply_to_token_initializer: false
  target_keywords:
    - to_q
    - to_k
    - to_v
    - to_o
    - to_g
    - fc1
    - fc2

ckpt_path: /dev/shm/pdb_metadata_latest/rfd3_latest.ckpt

datasets:
  diffusion_batch_size_train: 2
  crop_size: 384
  max_atoms_in_crop: 512
  train:
    pdb:
      probability: 1.0
      sub_datasets:
        interface:
          dataset:
            cif_parser_args:
              cache_dir: null
              load_from_cache: false
              save_to_cache: false
        pn_unit:
          dataset:
            cif_parser_args:
              cache_dir: null
              load_from_cache: false
              save_to_cache: false
    monomer_distillation: null
  val: null

trainer:
  prevalidate: False
  n_examples_per_epoch: 20
  validate_every_n_epochs: 5
  checkpoint_every_n_epochs: 10
  grad_accum_steps: 1
  max_epochs: 5
