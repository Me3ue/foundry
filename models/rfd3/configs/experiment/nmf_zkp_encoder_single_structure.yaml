# @package _global_
# ZKP-oriented NMF: first-priority proof targets.
#
# These layers sit at the input-shaping / encoder interface, so the middle
# square factor M is the most natural place to prove input integrity.
#
# Included:
#   - transition_post_token
#   - transition_post_atom
#   - process_s_init
#   - process_z_init
#   - process_c
#   - process_s_trunk
#
# Excluded on purpose:
#   - to_q / to_k / to_v / to_b / to_g
#   - process_r / process_a
#
# Most of these live in TokenInitializer, so NMF is injected into the full model.

defaults:
  - single_structure
  - _self_

name: nmf-zkp-encoder-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  apply_to_token_initializer: true
  target_keywords:
    - transition_post_token
    - transition_post_atom
    - process_s_init
    - process_z_init
    - process_c
    - process_s_trunk

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
