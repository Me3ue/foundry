# @package _global_
# Replacement NMF fine-tuning on the single-structure dataset.
#
# Why this target:
# - `fc1` is the first feed-forward projection in the MLP block.
# - It is usually the safest starting point for replacement NMF because it mainly performs feature
#   expansion/mixing, which is more compatible with a non-negative low-rank factorization than
#   attention geometry layers.
# - Starting with one projection makes it easier to tell whether the replacement mechanism itself
#   is stable before combining multiple targets.

defaults:
  - single_structure
  - _self_

name: nmf-fc1-only-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  target_keywords:
    - fc1

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
