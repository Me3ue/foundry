# @package _global_
# NMF-based replacement fine-tuning on the single-structure dataset.
#
# Why these layers:
# - `fc1` / `fc2`: these are the safest first targets because they are the main FFN/MLP projections
#   that primarily mix and expand/compress features. They are closer to “parts-based” factorization
#   than attention query/key/value projections, so replacement NMF is less likely to destroy the
#   geometry of attention scores.
# - `to_o`: the attention output projection is also a reasonable target because it recombines already
#   aggregated contextual information back into the hidden space. In practice it is more forgiving than
#   `to_q`, `to_k`, or `to_v`.
# - `to_g`: gating / fusion projections are often good candidates for structured low-dimensional
#   replacement because they act more like channel mixers than geometric similarity engines.
#
# Why not start with `to_q` / `to_k` / `to_v`:
# - these layers directly define the attention geometry and rely heavily on signed weights.
# - strict non-negative replacement can overly constrain the score distribution and destabilize training.
# - they are better treated as a later ablation, after the FFN / output-projection replacement is verified.
#
# Recommended first experiment: fc1 + fc2 only.
# Recommended second experiment: fc1 + fc2 + to_o + to_g.
# Avoid q/k/v in the first NMF pass unless you intentionally want a harder ablation.

defaults:
  - single_structure
  - _self_

name: nmf-single-structure

nmf:
  enabled: true
  # replacement = the original linear layer is replaced by a strictly non-negative low-rank map.
  # residual is intentionally not used here because you asked for a replacement-style formulation.
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  target_keywords:
    - fc1
    - fc2
    - to_o
    - to_g

# Start from the pretrained checkpoint while resetting optimizer state.
ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
