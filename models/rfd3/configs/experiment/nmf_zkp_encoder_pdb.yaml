# @package _global_
# ZKP encoder family, one linear at a time.
# Default target is the unique Linear inside process_s_init.
# Override nmf.target_keywords from the sweep to probe other encoder linears.

defaults:
  - nmf_zkp_pdb
  - _self_

name: nmf-zkp-encoder-pdb

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  apply_to_token_initializer: true
  match_mode: exact
  max_replacements: 1
  target_keywords:
    - token_initializer.process_s_init.1
