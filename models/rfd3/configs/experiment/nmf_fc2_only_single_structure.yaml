# @package _global_
# Replacement NMF fine-tuning on the single-structure dataset.
#
# Why this target:
# - `fc2` is the second feed-forward projection in the MLP block.
# - It compresses the expanded intermediate representation back into the model hidden dimension.
# - Like `fc1`, it is a feature-mixing layer rather than an attention geometry layer, so it is a
#   reasonable first candidate for strict non-negative replacement.

defaults:
  - single_structure
  - _self_

name: nmf-fc2-only-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  target_keywords:
    - fc2

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
