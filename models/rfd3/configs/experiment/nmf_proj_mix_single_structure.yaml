# @package _global_
# NMF sweep target for projection / mixing layers outside the attention qkv path.
# This is a broader setting than ffn_core, but still avoids attention geometry layers.

defaults:
  - single_structure
  - _self_

name: nmf-proj-mix-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  target_keywords:
    - process_pll
    - project_pll
    - to_r_update
    - upcast.project
    - downcast.project
    - process_n
    - sequence_head

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
