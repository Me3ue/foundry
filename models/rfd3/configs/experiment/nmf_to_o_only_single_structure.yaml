# @package _global_
# Replacement NMF fine-tuning on the single-structure dataset.
#
# Why this target:
# - `to_o` is the attention output projection.
# - It recombines already aggregated attention context back into the hidden state.
# - Compared with `to_q`, `to_k`, or `to_v`, this layer is less directly responsible for defining
#   the attention score geometry, so replacement NMF is less likely to damage core attention ranking.

defaults:
  - single_structure
  - _self_

name: nmf-to-o-only-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  target_keywords:
    - to_o

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
