# @package _global_
# ZKP projection family, one linear at a time.
# Default target is process_pll, a single Linear (not a container of several).

defaults:
  - nmf_zkp_pdb
  - _self_

name: nmf-zkp-proj-pdb

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  apply_to_token_initializer: true
  match_mode: exact
  max_replacements: 1
  target_keywords:
    - token_initializer.process_pll
