# @package _global_
# Final-report NMF sweep config for `single_structure`.
#
# Purpose
# -------
# This configuration is the documentation hub for the final NMF report sweep.
# It is intentionally organized by *module family* instead of legacy LoRA keywords.
# The goal is to replace only the layers that are structurally suitable for
# replacement NMF, while keeping training simple and interpretable:
# freeze all original weights and train only the NMF factors in the selected family.
#
# How to read the layer groups
# ----------------------------
# 1) FFN / transition family
#    These are the safest first-pass replacement targets because they mainly
#    mix hidden channels and expand/compress representations.
#    They are the closest match to the low-rank / parts-based intuition behind NMF.
#
#    Included modules:
#    - `transition_post_token`
#    - `transition_post_atom`
#    - `transition_1`
#    - `process_s_init`
#    - `process_z_init`
#    - `transition_2`
#    - `process_c`
#    - `process_s_trunk`
#    - `process_single_l`
#    - `process_single_m`
#    - `process_z`
#    - `pair_mlp`
#
# 2) Projection / mixing family
#    These layers are not attention Q/K/V, but they still move information between
#    subspaces or aggregate contextual signals. They are reasonable second-pass
#    replacement targets once the FFN family has been validated.
#
#    Included modules:
#    - `process_pll`
#    - `project_pll`
#    - `to_r_update`
#    - `upcast.project`
#    - `downcast.project`
#    - `process_n`
#    - `sequence_head`
#
# 3) What is intentionally excluded in the first pass
#    - `to_q`, `to_k`, `to_v`
#      These directly define attention geometry and are typically too sensitive
#      for strict replacement NMF.
#    - `process_r`, `process_a`
#      These are small geometry-facing projections (3D input/output) and are not
#      ideal first-pass NMF targets.
#    - raw attention pair-bias internals
#      These are core attention mechanics rather than clean projection blocks.
#
# Suggested report groups
# -----------------------
# - `ffn_core`: only the FFN / transition family
# - `proj_mix`: projection / mixing family
# - `head_plus_proj`: projection / mixing family plus the output head
#
# These groups are reflected in the sweep script so the report can compare a
# conservative setting, a broader mixing setting, and a head-inclusive setting.

defaults:
  - single_structure
  - _self_

name: nmf-final-single-structure

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  target_keywords:
    - transition_post_token
    - transition_post_atom
    - transition_1
    - process_s_init
    - process_z_init
    - transition_2
    - process_c
    - process_s_trunk
    - process_single_l
    - process_single_m
    - process_z
    - pair_mlp
    - process_pll
    - project_pll
    - to_r_update
    - upcast.project
    - downcast.project
    - process_n
    - sequence_head

ckpt_config:
  path: /media/zzj/Data/rfd3_latest.ckpt
  reset_optimizer: true
