# @package _global_
# One linear layer at a time. The sweep script overrides `name` and
# `nmf.target_keywords` so each job factorizes a single 2D weight.
#
# Matching is exact: a keyword must equal the module path, or be a suffix
# after a dot. Combined with max_replacements=1, a parent name such as
# `transition_post_token` will not replace linear_1/linear_2/linear_3.

defaults:
  - nmf_zkp_pdb
  - _self_

name: nmf-zkp-single-layer-pdb

nmf:
  enabled: true
  mode: replacement
  rank: 8
  alpha: 1.0
  eps: 1.0e-6
  nonnegative_param: softplus
  apply_to_token_initializer: true
  match_mode: exact
  max_replacements: 1
  target_keywords:
    - token_initializer.process_s_init.1
